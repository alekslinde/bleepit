name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete; don't pay for it.
# `main` is exempt so pushed commits each get a recorded result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Report every failing version, not just the first to fall over.
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --frozen-lockfile fails the build if the lockfile is out of sync with
      # the manifests, rather than silently resolving something else.
      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm test

      # Catches what type-checking source cannot: broken dts generation,
      # bad entry points, and anything that only surfaces when bundled.
      - run: pnpm build

  # The published artifact is what users actually run, so exercise it rather
  # than trusting that a green test suite implies a working package.
  smoke:
    name: smoke (built output)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Import built ESM and check core behavior
        run: node .github/scripts/smoke.mjs

  # Changesets requires Node 22.11+ (the libraries do not), so this job pins a
  # version rather than riding the matrix.
  changeset:
    name: changeset present
    runs-on: ubuntu-latest
    # Only meaningful on PRs, and not on release PRs, which consume changesets
    # rather than adding them.
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # changeset status diffs against the base branch, so it needs history.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Advisory: plenty of valid PRs (docs, tests, CI) need no changeset, so
      # this reports rather than blocks. Read the log, don't merge on autopilot.
      - name: Check for a changeset
        continue-on-error: true
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
