name: Pages

on:
  push:
    branches: [main]
    # The site bundles the packages it documents, so a change to any package's
    # source can alter what the page does. Matching every package's src keeps a
    # new package covered without editing this filter.
    paths:
      - "packages/site/**"
      - "packages/*/src/**"
      - ".github/workflows/pages.yml"
  # Allows a redeploy without an empty commit, e.g. after changing a setting.
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. Unlike the release workflow, a superseded run here is
# genuinely obsolete: the newer commit is what should be live, and a cancelled
# deploy leaves nothing half-published.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rebuild rather than deploying the committed bundle: that file is a
      # build artifact, and a stale one would ship a demo that does not match
      # the library it claims to demonstrate.
      - run: pnpm site:build

      # The committed bundle is supposed to track site/main.ts. If the rebuild
      # above changed it, the two have drifted and the repo is misleading
      # anyone reading the checked-in file. Deploy still proceeds — the built
      # output is correct either way — but the log flags it.
      #
      # Only the JS bundle is checked: the compiled stylesheet is generated at
      # build time and deliberately not committed, so it has nothing to drift
      # from.
      - name: Warn if the committed bundle was stale
        run: |
          if ! git diff --quiet -- packages/site/bleepit.bundle.js; then
            echo "::warning file=packages/site/bleepit.bundle.js::\
          Committed bundle differs from a fresh build. Run 'pnpm site:build' and commit the result."
          fi

      # Collect just the files the page serves. The site package also holds its
      # manifest, tsconfig, TypeScript sources and a node_modules — none of
      # which belong in a Pages artifact, and the last of which would bloat
      # every deploy.
      # CNAME pins the custom domain to the deployment itself. Pages also stores
      # the domain as a repo setting, but shipping it in the artifact means a
      # deploy can never serve the site without it.
      #
      # robots.txt and sitemap.xml must sit at the origin root to be honoured —
      # a crawler reads them from /robots.txt and nowhere else — so they are
      # copied flat alongside index.html rather than into a subdirectory.
      - name: Assemble the deployable site
        run: |
          mkdir -p _site
          cp packages/site/index.html packages/site/.nojekyll packages/site/CNAME _site/
          cp packages/site/robots.txt packages/site/sitemap.xml _site/
          cp packages/site/bleepit.bundle.js packages/site/styles.build.css _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: deploy to pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # Both required by deploy-pages: it swaps the live deployment using an
      # OIDC token rather than a stored credential.
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
