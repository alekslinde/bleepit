name: Release

on:
  push:
    branches: [main]

# Two pushes to main must not race: one run publishing while another versions
# the same packages can leave a tag without a tarball. Never cancel a run that
# may already be mid-publish — queue behind it instead.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: version or publish
    runs-on: ubuntu-latest
    permissions:
      # changesets/action opens and updates the "Version Packages" PR, and
      # pushes the version commit + tags on release.
      contents: write
      pull-requests: write
      # Required for npm provenance: the OIDC token is what lets npm attest
      # that this tarball was built from this commit, in this workflow.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # changesets reads tags to work out what has already been released.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # 24, not the 22 that CI's matrix floors at: publishing here happens
          # over OIDC (npm trusted publishing), which the npm CLI only supports
          # from 11.5.1, and Node 22 still bundles npm 10.x. On an older npm the
          # OIDC token is never exchanged for a registry credential, so the
          # publish goes out unauthenticated and the registry answers `E404 Not
          # Found` on the PUT — it will not confirm a package exists to a writer
          # it has not authenticated. That reads as a missing package rather
          # than a missing credential, so it is worth naming here.
          node-version: "24"
          cache: pnpm
          # Points npm at the registry it performs the OIDC exchange against.
          # Without it there is no registry configured to authenticate to.
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Publishing an artifact that was never tested is how a broken release
      # reaches users. Same gates as CI, run again here because a green check
      # on the PR does not prove the merge commit is green.
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

      # Two modes, decided by whether unconsumed changesets exist:
      #   - changesets present -> opens/updates a "Version Packages" PR
      #   - none present (that PR was merged) -> runs `publish`
      # So a release is always a reviewed, merged PR, never a direct push.
      #
      # Despite the step name, `publish` here stages rather than publishes. CI
      # uploads the tarballs and they sit pending until a maintainer approves
      # them with 2FA, so nothing this workflow does can reach installers on its
      # own. Merging the version PR reviews the version bump; approving the
      # stage reviews the artifact that bump produced, which is the step that
      # covers a build compromised between the two.
      - name: Create version PR or stage release
        uses: changesets/action@v1
        with:
          # `pnpm run`, not `pnpm <script>`: pnpm has a built-in `version`
          # command that shadows a script of the same name and fails with
          # ERR_PNPM_INVALID_VERSION_BUMP. The script is named version:packages
          # for the same reason — so a future builtin cannot shadow it either.
          version: pnpm run version:packages
          publish: pnpm run release
          commit: "chore(config): version packages"
          title: "chore(config): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm credential is passed: each package names this workflow as a
          # trusted publisher, so authentication is the OIDC token that
          # `id-token: write` above grants. Setting an empty NODE_AUTH_TOKEN
          # here is worse than setting none — changesets picks the auth mode by
          # checking for that variable, and an empty one still reads as absent
          # while implying to anyone reading that a token is what signs a
          # release.
          #
          # Provenance is requested by `--provenance` in the release script,
          # not by an env var: pnpm reads the flag but not NPM_CONFIG_PROVENANCE.
          # `changeset publish` could not pass it — it builds a hardcoded arg
          # list — which is part of why the release script drives
          # `pnpm stage publish` directly instead.
