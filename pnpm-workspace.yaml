packages:
  - "packages/*"

allowBuilds:
  esbuild: true

overrides:
  # tsup pins esbuild at ^0.27.0, which cannot reach the 0.28.1 that fixes
  # GHSA-g7r4-m6w7-qqqr (dev-server file read on Windows) — a caret does not
  # cross a 0.x minor. Nothing here runs the esbuild dev server, so this is
  # housekeeping rather than a live exposure; drop it once tsup widens its range.
  "esbuild@<0.28.1": ">=0.28.1"
